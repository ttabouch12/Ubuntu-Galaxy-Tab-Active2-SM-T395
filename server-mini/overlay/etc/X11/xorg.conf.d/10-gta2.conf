# gta2: plain fbdev on decon fb0 (800x1280 panel, mounted 180 deg -> Rotate UD)
Section "Device"
    Identifier "decon"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
    Option "ShadowFB" "on"
    Option "Rotate" "UD"
EndSection
Section "ServerFlags"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection
Section "Screen"
    Identifier "s0"
    Device "decon"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
    EndSubSection
EndSection
