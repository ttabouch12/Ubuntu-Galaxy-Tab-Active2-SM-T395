[General]
__userfile__=true

[panel1]
alignment=-1
animation-duration=0
background-color=@Variant(\0\0\0\x43\x1\xff\xff\x1e\x1e!!$$\0\0)
background-image=
desktop=0
font-color=@Variant(\0\0\0\x43\x1\xff\xff\xfc\xfc\xfc\xfc\xfc\xfc\0\0)
hidable=false
iconSize=24
lineCount=1
lockPanel=true
opacity=95
panelSize=44
plugins=fancymenu, quicklaunch, taskbar, statusnotifier, tray, worldclock, showdesktop
position=Bottom
reserve-space=true
show-delay=0
visible-margin=true
width=100
width-percent=true

[fancymenu]
type=fancymenu
icon=/usr/share/icons/breeze-dark/places/32/start-here-kde.svg
ownIcon=true
showText=false

[mainmenu]
type=mainmenu

[quicklaunch]
type=quicklaunch
apps\1\desktop=/usr/share/applications/pcmanfm-qt.desktop
apps\2\desktop=/usr/share/applications/qterminal.desktop
apps\3\desktop=/home/gta2/.local/share/applications/pi-apps.desktop
apps\size=3

[taskbar]
type=taskbar
buttonWidth=220
buttonHeight=44
showOnlyOneDesktopTasks=true
groupingEnabled=true
raiseOnCurrentDesktop=true

[statusnotifier]
type=statusnotifier

[tray]
type=tray

[worldclock]
type=worldclock
formatType=custom-timeonly
customFormat="'<b>'HH:mm'</b><br/><font size=\"-2\">'ddd d MMM'</font>'"
autoRotate=true

[showdesktop]
type=showdesktop
