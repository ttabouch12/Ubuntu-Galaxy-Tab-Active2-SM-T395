# gta2srv mainline: U-Boot (BOOT partition) reads this from the root of USERDATA.
# The initramfs renames this file after 2 failed boots -> U-Boot then reboots into TWRP.
default gta2srv
timeout 1
label gta2srv
  menu label Ubuntu Server Mini (mainline)
  linux /gta2srv/ml/Image
  fdt /gta2srv/ml/exynos7870-gtactive2lte.dtb
  initrd /gta2srv/ml/initramfs.cpio.gz
  append console=tty0 loglevel=5 panic=10 clk_ignore_unused pd_ignore_unused fbcon=rotate:2 s3c2410_wdt.tmr_atboot=1 s3c2410_wdt.tmr_margin=60
